    "/healthz": {
      "get": {
        "operationId": "healthz",
        "security": [],
        "responses": {
          "200": {
            "description": "Fixed public status only",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "status": {
                      "type": "string",
                      "enum": [
                        "ok",
                        "ready",
                        "not_ready"
                      ]
                    }
                  },
                  "required": [
                    "status"
                  ],
                  "additionalProperties": false
                }
              }
            }
