          "401": {
            "description": "Machine authentication required"
          },
          "413": {
            "description": "Budget exceeded"
          },
          "429": {
            "description": "Four child processes are already running"
          },
          "503": {
            "description": "Artifact unavailable"
          },
          "504": {
            "description": "Child process exceeded five seconds and was reaped"
          }
        },
