# Defaults < YAML < INFRAPRO_* environment variables. Never commit real secrets.
http_addr: 127.0.0.1:8080
log_level: info
shutdown_timeout: 5s
database_url: '' # Required; prefer INFRAPRO_DATABASE_URL.
redis_url: '' # Required; prefer INFRAPRO_REDIS_URL.
redis_key_prefix: 'infrapro:dev:identity:v1:'
csrf_auth_key: '' # Required: 32 random bytes encoded as 64 hex characters.
public_console_url: http://127.0.0.1:5173/
trusted_origins: 'http://127.0.0.1:5173'
trusted_proxies: ''
cookie_secure: 'false'
# HTTPS behind Nginx: merge deploy/display/https.example.yaml; all three public
# origins and trusted_origins must use HTTPS with cookie_secure=true.
# Backend HTTP stays private; never trust arbitrary forwarded headers.
support_contact: '' # Required: actual deployment maintenance contact.
session_idle_timeout: 2h
session_absolute_timeout: 12h
session_cache_ttl: 5m
invitation_ttl: 24h
password_reset_ttl: 30m
invitation_rate: '5'
invitation_limit: '20'
ip_request_limit: '120'
credential_request_limit: '20'
password_failures: '5'
audit_retention: 2160h
# Monitoring is optional until configured. API and the independent worker share
# these settings. Use environment variables for real credentials.
monitoring_clickhouse_replicas: '' # One or more comma-separated native endpoints; empty disables monitoring storage.
monitoring_clickhouse_database: infrapro_monitoring
monitoring_clickhouse_user: default
monitoring_clickhouse_password: ''
monitoring_clickhouse_policy: monitoring_tiered
monitoring_clickhouse_tls: 'false'
monitoring_object_endpoint: ''
monitoring_object_access_key: ''
monitoring_object_secret_key: ''
monitoring_source_bucket: ''
monitoring_temp_directory: '' # Empty uses the OS temporary directory; 8 GiB per task.
monitoring_export_rows_per_file: "1000000"
monitoring_export_bytes_per_file: "268435456" # CSV bytes; Parquet may finish its bounded 8 MiB row group.

# Event-time placement target in days; never a deletion/retention TTL.
monitoring_hot_days: "90"
monitoring_online_volume: online
# Additional physical shards share CH credentials/TLS and the source bucket.
# Each shard accepts one or more real endpoints; one endpoint has no redundancy.
# JSON array: [{"name":"second","database":"infrapro_monitoring_second","replicas":["ch3:9000","ch4:9000"]}]
monitoring_physical_shards: "[]"

# Independent backup namespace/credentials; required only by backup/restore CLI.
monitoring_backup_endpoint: ""
monitoring_backup_access_key: ""
monitoring_backup_secret_key: ""
monitoring_backup_bucket: ""
monitoring_backup_named_collection: monitoring_backups

# One shared durable queue for raw and derived monitoring. A stalled lease can
# be taken over; the old fencing token cannot publish or replace checkpoints.
monitoring_task_lease: 30s
monitoring_task_heartbeat: 5s
monitoring_task_attempts: "5"
# Deployment limits apply to API, worker and CLI. They never change a rule's
# matching/window/precision semantics. INFRAPRO_DERIVED_<UPPERCASE_KEY> overrides.
derived:
  foreground_workers: "1"
  historical_workers: "1"
  rule_inputs: "16"
  rule_nodes: "32"
  rule_parameters: "32"
  graph_depth: "8"
  trial_rows: "100000"
  trial_examples: "2000"
  trial_range: 24h
  trial_deadline: 3s
  trial_ttl: 30m
  window_samples: "1000000"
  output_rows: "1000000"
  write_rows: "100000"
  memory_bytes: "1073741824"
  temporary_bytes: "21474836480"
  read_bytes: "268435456"
  write_bytes: "67108864"
  schedule_batch: "100"
  tenant_batch: "16"
  event_batch: "100"
  export_ttl: 168h
  temporary_ttl: 24h

# Whole-file admission limits in bytes. Positive integers; restart API and workers
# together after changes. Existing uploads retain their accepted size.
files:
  max_file_bytes: '104857600' # 100 MiB; individual parts remain at most 8 MiB
uploads:
  spatial_max_file_bytes: '268435456' # 256 MiB; 8 MiB parts
  monitoring_csv_max_bytes: '34359738368' # 32 GiB; 32 MiB parts
  monitoring_xlsx_max_bytes: '536870912' # 512 MiB; 32 MiB parts
  display_max_package_bytes: '134217728' # 128 MiB; 4 MiB parts
mfa_keyring_file: /etc/infrapro/private/mfa-keyring.json
mfa_issuer: InfraPro
