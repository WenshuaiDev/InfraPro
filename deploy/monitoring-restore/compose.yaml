# A disposable, independent restore target. Use an explicit unique project name.
x-clickhouse: &clickhouse
  image: clickhouse/clickhouse-server:26.8.36.3-alpine@sha256:f5443f9ffa48f0154cdd50cab39fed732201762574a27f04f1f564bbba81832d
  mem_limit: 1400m
  volumes: ['./clickhouse.xml:/etc/clickhouse-server/config.d/restore.xml:ro']
  depends_on:
    keeper: {condition: service_started}
    s3: {condition: service_started}
  healthcheck:
    test: [CMD, clickhouse-client, --query, 'SELECT 1']
    interval: 2s
    timeout: 3s
    retries: 60
services:
  postgres:
    image: postgres:17-alpine@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
    environment:
      POSTGRES_USER: restore_local
      POSTGRES_PASSWORD: restore-local-test-only
      POSTGRES_DB: restore_local
    ports: ['127.0.0.1:57432:5432']
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: [CMD, pg_isready, -U, restore_local, -d, restore_local]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7.4-alpine
    command: [redis-server, --requirepass, restore-local-test-only, --maxmemory, 64mb, --maxmemory-policy, noeviction]
    ports: ['127.0.0.1:57379:6379']
  keeper:
    image: clickhouse/clickhouse-keeper:26.8.36.3-alpine@sha256:82cb1687db7d461b180ac17b5a7a1db91d9fcbf8ba91aa32aea85998cd61383d
    volumes: ['./keeper.xml:/etc/clickhouse-keeper/keeper_config.xml:ro']
    mem_limit: 384m
  s3:
    image: chrislusf/seaweedfs:4.53@sha256:ccad23e18639c8b98cee17e7100b95830a06077b56d8e5b006d6dcf8ec5e94a0
    command: [server, -ip=s3, -dir=/data, -s3, -s3.config=/etc/restore/s3.json, -volume.max=40, -master.volumeSizeLimitMB=128]
    ports: ['127.0.0.1:59333:8333']
    volumes: ['./s3.json:/etc/restore/s3.json:ro']
    mem_limit: 512m
  ch1:
    <<: *clickhouse
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: '1'
      CONTRACT_REPLICA: restore1
      CONTRACT_S3_ENDPOINT: http://s3:8333/restore-ch/ch1/
    ports: ['127.0.0.1:60000:9000', '127.0.0.1:59123:8123']
  ch2:
    <<: *clickhouse
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: '1'
      CONTRACT_REPLICA: restore2
      CONTRACT_S3_ENDPOINT: http://s3:8333/restore-ch/ch2/
    ports: ['127.0.0.1:60001:9000', '127.0.0.1:59124:8123']
