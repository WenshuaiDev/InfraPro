# The console application and API share an HTTP host and a host-only session cookie.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    # Keep redirects relative so reverse-proxy/published ports are preserved.
    absolute_redirect off;
    client_max_body_size 16k;
    # No request URL/body logging: fragments stay in browsers, and accidental query secrets stay out of logs.
    access_log off;
    # Request errors append raw request/upstream URLs. Discard this server's errors;
    # process/configuration errors retain the main log. Use API logs and probes for requests.
    error_log /dev/null;
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Cache-Control no-store always;
    # Radix scroll locks and Sonner inject style elements. Script eval/inline scripts
    # remain blocked; style attributes still inherit the self-only style policy.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; style-src-elem 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location = / { return 302 /console/; }
    location = /console { return 302 /console/; }
    # Retired display entry points have fixed, same-host destinations.
    location = /screen { return 302 /console/; }
    location = /screen/ { return 302 /console/; }
    location = /screen/login { return 302 /console/login; }
    location /screen/ { return 302 /console/; }
    location /console/ { try_files $uri $uri/ /console/index.html; }
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto http;
        proxy_read_timeout 20s;
        proxy_connect_timeout 3s;
        proxy_intercept_errors off;
        error_page 502 504 =503 @api_unavailable;
    }
    location = /healthz { proxy_pass http://api:8080; }
    location = /readyz { proxy_pass http://api:8080; }
    location @api_unavailable {
        default_type application/json;
        return 503 '{"code":"unavailable","message":"服务暂时不可用，请稍后重试。","request_id":"$request_id"}';
    }
    location / { return 404; }
}
