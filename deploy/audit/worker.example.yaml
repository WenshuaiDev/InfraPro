# Database and S3 credentials come from the protected service environment file.
# INFRAPRO_DATABASE_URL is a LOGIN role inheriting infrapro_audit_worker.
audit:
  node_id: audit-worker-01
  temp_directory: /var/lib/infrapro/audit
  page_size: '50'
  max_page_size: '100'
  candidate_budget: '2000'
  query_default_window: 168h
  max_window: 8784h
  metadata_timeout: 3s
  export_max_rows: '50000'
  export_max_bytes: '104857600'
  export_snapshot_max_bytes: '134217728'
  export_snapshot_timeout: 15s
  export_worker_concurrency: '2'
  active_per_account: '2'
  active_per_scope: '10'
  active_per_instance: '100'
  export_lease: 60s
  export_heartbeat: 10s
  export_max_attempts: '3'
  export_result_ttl: 24h
  export_temp_budget: '536870912'
  download_per_account: '2'
  download_per_node: '8'
  read_lease: 30s
  read_heartbeat: 10s
  read_timeout: 15m
  failed_fact_timeout: 2s
  transfer_stale_after: 20m
  fact_batch: '500'
  object_batch: '100'
  cleanup_mode: plan_only
