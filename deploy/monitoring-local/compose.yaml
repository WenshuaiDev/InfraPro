# Persistent synthetic local acceptance environment; loopback only.
name: infrapro-monitoring-local
x-clickhouse: &clickhouse
  image: clickhouse/clickhouse-server:26.8.36.3-alpine@sha256:f5443f9ffa48f0154cdd50cab39fed732201762574a27f04f1f564bbba81832d
  mem_limit: 1400m
  volumes: ['./clickhouse.xml:/etc/clickhouse-server/config.d/acceptance.xml:ro']
  depends_on:
    keeper: {condition: service_started}
    s3: {condition: service_started}
  healthcheck:
    test: [CMD, clickhouse-client, --query, 'SELECT 1']
    interval: 2s
    timeout: 3s
    retries: 60
services:
  postgres:
    image: postgres:17-alpine@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
    environment:
      POSTGRES_USER: acceptance_local
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run pnpm monitoring:local setup}
      POSTGRES_DB: acceptance_local
    ports: ['127.0.0.1:58432:5432']
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD, pg_isready, -U, acceptance_local, -d, acceptance_local]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7.4-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?run pnpm monitoring:local setup}
    command: [sh, -c, 'exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes --maxmemory 64mb --maxmemory-policy noeviction']
    volumes: [redis_data:/data]
    ports: ['127.0.0.1:58379:6379']
  keeper:
    image: clickhouse/clickhouse-keeper:26.8.36.3-alpine@sha256:82cb1687db7d461b180ac17b5a7a1db91d9fcbf8ba91aa32aea85998cd61383d
    volumes: ['./keeper.xml:/etc/clickhouse-keeper/keeper_config.xml:ro', keeper_data:/var/lib/clickhouse-keeper]
    mem_limit: 384m
  s3:
    image: chrislusf/seaweedfs:4.53@sha256:ccad23e18639c8b98cee17e7100b95830a06077b56d8e5b006d6dcf8ec5e94a0
    command: [server, -ip=s3, -dir=/data, -s3, -s3.config=/etc/acceptance/s3.json, -volume.max=40, -master.volumeSizeLimitMB=128]
    ports: ['127.0.0.1:61333:8333']
    volumes: ['./s3.json:/etc/acceptance/s3.json:ro', source_data:/data]
    mem_limit: 512m
  backup-s3:
    image: chrislusf/seaweedfs:4.53@sha256:ccad23e18639c8b98cee17e7100b95830a06077b56d8e5b006d6dcf8ec5e94a0
    command: [server, -ip=backup-s3, -dir=/data, -s3, -s3.config=/etc/acceptance/s3.json, -volume.max=10, -master.volumeSizeLimitMB=128]
    ports: ['127.0.0.1:61334:8333']
    volumes: ['./backup-s3.json:/etc/acceptance/s3.json:ro', backup_data:/data]
    mem_limit: 384m
  ch1:
    <<: *clickhouse
    volumes: ['./clickhouse.xml:/etc/clickhouse-server/config.d/acceptance.xml:ro', ch1_data:/var/lib/clickhouse]
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: '1'
      CONTRACT_REPLICA: acceptance1
      CONTRACT_S3_ENDPOINT: http://s3:8333/acceptance-ch/ch1/
    ports: ['127.0.0.1:61000:9000', '127.0.0.1:61123:8123']
  ch2:
    <<: *clickhouse
    volumes: ['./clickhouse.xml:/etc/clickhouse-server/config.d/acceptance.xml:ro', ch2_data:/var/lib/clickhouse]
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: '1'
      CONTRACT_REPLICA: acceptance2
      CONTRACT_S3_ENDPOINT: http://s3:8333/acceptance-ch/ch2/
    ports: ['127.0.0.1:61001:9000', '127.0.0.1:61124:8123']

volumes:
  postgres_data:
  redis_data:
  keeper_data:
  source_data:
  backup_data:
  ch1_data:
  ch2_data:
