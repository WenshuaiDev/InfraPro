name: infrapro-local
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: infrapro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run pnpm setup:local}
      POSTGRES_DB: infrapro
    ports: ['127.0.0.1:5432:5432']
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U infrapro -d infrapro]
      interval: 2s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?run pnpm setup:local}
    command: [sh, -c, 'exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction']
    ports: ['127.0.0.1:6379:6379']
    volumes: [redis_data:/data]
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
  redis_data:
