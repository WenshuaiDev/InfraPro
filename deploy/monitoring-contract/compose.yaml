name: infrapro-monitoring-contract

# Disposable S-01 laboratory. These credentials are test-only; never use this
# topology or its identities for tenant data. Only loopback ports are exposed.
x-clickhouse: &clickhouse
  image: clickhouse/clickhouse-server:26.8.36.3-alpine@sha256:f5443f9ffa48f0154cdd50cab39fed732201762574a27f04f1f564bbba81832d
  mem_limit: 2g
  volumes:
    - ./clickhouse.xml:/etc/clickhouse-server/config.d/contract.xml:ro
  depends_on:
    keeper: {condition: service_started}
    s3: {condition: service_started}
  healthcheck:
    test: [CMD, clickhouse-client, --query, 'SELECT 1']
    interval: 2s
    timeout: 3s
    retries: 60

services:
  postgres:
    image: postgres:17-alpine@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
    environment:
      POSTGRES_USER: contract
      POSTGRES_PASSWORD: contract-only-local-password
      POSTGRES_DB: contract
    ports: ['127.0.0.1:56432:5432']
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: [CMD, pg_isready, -U, contract, -d, contract]
      interval: 2s
      timeout: 3s
      retries: 30
  keeper:
    image: clickhouse/clickhouse-keeper:26.8.36.3-alpine@sha256:82cb1687db7d461b180ac17b5a7a1db91d9fcbf8ba91aa32aea85998cd61383d
    volumes: ['./keeper.xml:/etc/clickhouse-keeper/keeper_config.xml:ro']
    mem_limit: 512m
  s3:
    image: chrislusf/seaweedfs:4.53@sha256:ccad23e18639c8b98cee17e7100b95830a06077b56d8e5b006d6dcf8ec5e94a0
    command: [server, -ip=s3, -dir=/data, -s3, -s3.config=/etc/contract/s3.json, -volume.max=64, -master.volumeSizeLimitMB=128, -s3.readerCacheSizeMB=128, -s3.concurrentUploadLimitMB=128, -s3.concurrentFileUploadLimit=8, -volume.concurrentDownloadLimitMB=128]
    environment:
      GOMEMLIMIT: 512MiB
      GOGC: '50'
    ports: ['127.0.0.1:58333:8333']
    volumes: ['./s3.json:/etc/contract/s3.json:ro']
    mem_limit: 768m
  # Audit restore tests keep source and destination buckets alive together.
  # A separate disposable volume server provides capacity without replacing
  # the shared S3 container or removing any existing contract objects.
  audit-volume:
    image: chrislusf/seaweedfs:4.53@sha256:ccad23e18639c8b98cee17e7100b95830a06077b56d8e5b006d6dcf8ec5e94a0
    command: [volume, -ip=audit-volume, -dir=/data, -master=s3:9333, -max=64]
    depends_on:
      s3: {condition: service_started}
    environment:
      GOMEMLIMIT: 192MiB
    mem_limit: 256m
  backup-s3:
    image: chrislusf/seaweedfs:4.53@sha256:ccad23e18639c8b98cee17e7100b95830a06077b56d8e5b006d6dcf8ec5e94a0
    command: [server, -ip=backup-s3, -dir=/data, -s3, -s3.config=/etc/contract/s3.json, -volume.max=10, -master.volumeSizeLimitMB=128]
    ports: ['127.0.0.1:58334:8333']
    volumes: ['./backup-s3.json:/etc/contract/s3.json:ro']
    mem_limit: 384m
  ch1:
    <<: *clickhouse
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: '1'
      CONTRACT_REPLICA: ch1
      CONTRACT_S3_ENDPOINT: http://s3:8333/contract-ch/ch1/
    ports: ['127.0.0.1:59000:9000', '127.0.0.1:58123:8123']
  ch2:
    <<: *clickhouse
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: '1'
      CONTRACT_REPLICA: ch2
      CONTRACT_S3_ENDPOINT: http://s3:8333/contract-ch/ch2/
    ports: ['127.0.0.1:59001:9000', '127.0.0.1:58124:8123']
