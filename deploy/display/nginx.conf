# Include inside nginx http {}. Replace hosts and root for this installation.
# All three names resolve to this proxy. Backend listen ports stay private.
server {
    listen 80;
    server_name console.infra.lan;
    root /opt/infrapro/web;
    server_tokens off;
    access_log off;
    error_log /dev/null;
    absolute_redirect off;
    client_max_body_size 16k;
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Cache-Control no-store always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; style-src-elem 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    location = / { return 302 /console/; }
    location = /console { return 302 /console/; }
    location /console/ { try_files $uri $uri/ /console/index.html; }
    location /api/ {
        # BEGIN generated upload policy (node scripts/nginx-routes.mjs)
        location ~ ^/api/v1/account/avatar$ {
            client_max_body_size 5m;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_request_buffering off;
            proxy_read_timeout 180s;
            proxy_send_timeout 120s;
            client_body_timeout 120s;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Forwarded '';
            proxy_set_header X-Forwarded-Host '';
            proxy_pass http://127.0.0.1:8080;
        }
        location ~ ^/api/v1/tenants/[^/]+(/projects/[^/]+)?/(files|spatial)/uploads/[^/]+/parts/[0-9]+$ {
            client_max_body_size 8m;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_request_buffering off;
            proxy_read_timeout 180s;
            proxy_send_timeout 120s;
            client_body_timeout 120s;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Forwarded '';
            proxy_set_header X-Forwarded-Host '';
            proxy_pass http://127.0.0.1:8080;
        }
        location ~ ^/api/v1/tenants/[^/]+(/projects/[^/]+)?/monitoring/imports/[^/]+/upload/parts/[0-9]+$ {
            client_max_body_size 32m;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_request_buffering off;
            proxy_read_timeout 180s;
            proxy_send_timeout 120s;
            client_body_timeout 120s;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Forwarded '';
            proxy_set_header X-Forwarded-Host '';
            proxy_pass http://127.0.0.1:8080;
        }
        location ~ ^/api/v1/tenants/[^/]+(/projects/[^/]+)?/displays/instances/[^/]+/uploads/[^/]+/parts/[0-9]+$ {
            client_max_body_size 4m;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_request_buffering off;
            proxy_read_timeout 180s;
            proxy_send_timeout 120s;
            client_body_timeout 120s;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Forwarded '';
            proxy_set_header X-Forwarded-Host '';
            proxy_pass http://127.0.0.1:8080;
        }
        location ~ ^/api/v1/tenants/[^/]+(/projects/[^/]+)?/monitoring/imports/[^/]+/upload/complete$ {
            client_max_body_size 256k;
            proxy_read_timeout 1810s;
            proxy_pass http://127.0.0.1:8080;
        }
        location ~ ^/api/v1/tenants/[^/]+(/projects/[^/]+)?/spatial/uploads/[^/]+/complete$ {
            client_max_body_size 256k;
            proxy_read_timeout 310s;
            proxy_pass http://127.0.0.1:8080;
        }
        location ~ ^/api/v1/tenants/[^/]+(/projects/[^/]+)?/files/attachments/[^/]+/revisions/[^/]+/(content|preview)$ {
            client_max_body_size 64k;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 120s;
            send_timeout 120s;
            proxy_pass http://127.0.0.1:8080;
        }
        location ~ ^/api/v1/tenants/[^/]+(/projects/[^/]+)?/engineering/resources/.*/attachments/[^/]+/attachment-(content|preview)$ {
            client_max_body_size 256k;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 120s;
            send_timeout 120s;
            proxy_pass http://127.0.0.1:8080;
        }
        location ~ ^/api/v1/tenants/[^/]+(/projects/[^/]+)?/spatial/versions/[^/]+/(source|files/[^/]+)$ {
            client_max_body_size 256k;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 120s;
            send_timeout 120s;
            proxy_pass http://127.0.0.1:8080;
        }
        location ~ ^/api/v1/tenants/[^/]+(/projects/[^/]+)?/monitoring/(source-files/[^/]+/download|exports/[^/]+/files/[^/]+/download|analysis/exports/[^/]+/files/[^/]+/download)$ {
            client_max_body_size 256k;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 120s;
            send_timeout 120s;
            proxy_pass http://127.0.0.1:8080;
        }
        location ~ ^/api/v1/tenants/[^/]+(/projects/[^/]+)?/displays(/|$) {
            client_max_body_size 1m;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 120s;
            send_timeout 120s;
            proxy_pass http://127.0.0.1:8080;
        }
        location ~ ^/api/v1/(platform|tenants/[^/]+(/projects/[^/]+)?)/device-classifications(/|$) {
            client_max_body_size 8m;
            proxy_pass http://127.0.0.1:8080;
        }
        location ~ ^/api/v1/(platform|tenants/[^/]+(/projects/[^/]+)?)/parsing/samples/[^/]+/content$ {
            client_max_body_size 6m;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_request_buffering off;
            proxy_read_timeout 180s;
            proxy_send_timeout 120s;
            client_body_timeout 120s;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Forwarded '';
            proxy_set_header X-Forwarded-Host '';
            proxy_pass http://127.0.0.1:8080;
        }
        location ~ ^/api/v1/(platform|tenants/[^/]+(/projects/[^/]+)?)/(engineering|device-definitions|device-catalog|devices|device-outputs|device-access)(/|$) {
            client_max_body_size 272k;
            proxy_pass http://127.0.0.1:8080;
        }
        location ~ ^/api/v1/tenants/[^/]+(/projects/[^/]+)?/(monitoring|monitoring-access|spatial|spatial-access|sources|resource-access)(/|$) {
            client_max_body_size 256k;
            proxy_pass http://127.0.0.1:8080;
        }
        location ~ ^/api/v1/(platform|tenants/[^/]+(/projects/[^/]+)?)/(parsing|ingestion)(/|$) {
            client_max_body_size 256k;
            proxy_pass http://127.0.0.1:8080;
        }
        location ~ ^/api/v1/tenants/[^/]+(/projects/[^/]+)?/files(/|$) {
            client_max_body_size 64k;
            proxy_pass http://127.0.0.1:8080;
        }
        location ~ ^/api/v1/tenants/[^/]+/projects(/|$) {
            client_max_body_size 64k;
            proxy_pass http://127.0.0.1:8080;
        }
        location ~ ^/api/v1/(platform/tenants|tenants|access)(/|$) {
            client_max_body_size 32k;
            proxy_pass http://127.0.0.1:8080;
        }
        # END generated upload policy
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host "";
        proxy_read_timeout 30s;
        proxy_connect_timeout 3s;
            proxy_intercept_errors off;
        error_page 413 =413 @request_too_large;
        error_page 502 504 =503 @api_unavailable;
}
    location @request_too_large {
        default_type application/json;
        return 413 '{"code":"request_too_large","message":"请求超过该接口允许的大小，请核对文件分片或提交内容。","request_id":"$request_id"}';
    }
    location @api_unavailable {
        default_type application/json;
        return 503 '{"code":"unavailable","message":"服务暂时不可用，请稍后重试。","request_id":"$request_id"}';
    }
    location / { return 404; }
}
server {
    listen 80;
    server_name display.infra.lan;
    server_tokens off;
    access_log off;
    error_log /dev/null;
    client_max_body_size 4m;
    error_page 413 =413 @tool_request_too_large;
    location @tool_request_too_large {
        default_type application/json;
        return 413 '{"code":"request_too_large","message":"请求超过该接口允许的大小。","request_id":"$request_id"}';
    }
    # Runtime provides CSP, no-store, no-referrer, HttpOnly/host-only cookies.
    # Do not overwrite those headers or log request URLs/cookies/headers/bodies.
    location /internal/ { return 404; }
    location / {
        proxy_pass http://127.0.0.1:5180;
        location ~ ^/tool/[^/]+/part$ {
            proxy_read_timeout 180s;
            proxy_pass http://127.0.0.1:5180;
        }
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 75s;
        proxy_connect_timeout 3s;
        proxy_send_timeout 120s;
        client_body_timeout 120s;
    }
}
server {
    listen 80;
    server_name display-assets.infra.lan;
    server_tokens off;
    access_log off;
    error_log /dev/null;
    client_max_body_size 1k;
    # Never log the asset permit in its path. Do not serve the bucket directly.
    location /assets/ {
        proxy_pass http://127.0.0.1:5181;
        proxy_set_header Host $http_host;
        proxy_set_header Cookie '';
        proxy_set_header Authorization '';
        proxy_cache off;
        proxy_read_timeout 20s;
        proxy_connect_timeout 3s;
    }
    location / { return 404; }
}
