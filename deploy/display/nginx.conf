# Include inside nginx http {}. Replace hosts and root for this installation.
# All three names resolve to this proxy. Backend listen ports stay private.
server {
    listen 80;
    server_name console.infra.lan;
    root /opt/infrapro/web;
    server_tokens off;
    access_log off;
    error_log /dev/null;
    absolute_redirect off;
    client_max_body_size 16k;
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Cache-Control no-store always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; style-src-elem 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    location = / { return 302 /console/; }
    location = /console { return 302 /console/; }
    location /console/ { try_files $uri $uri/ /console/index.html; }
    location /api/ {
        # Only display endpoints get their typed body/part limits. Handlers
        # still apply the smaller command limit and SHA-256 part verification.
        location ~ ^/api/v1/tenants/[^/]+/projects/[^/]+/displays(/|$) {
            client_max_body_size 4m;
            proxy_pass http://127.0.0.1:8080;
        }
        location ~ ^/api/v1/(platform|tenants/[^/]+(/projects/[^/]+)?)/(engineering|device-definitions|device-catalog|devices|device-outputs|device-access)(/|$) {
            client_max_body_size 272k;
            proxy_pass http://127.0.0.1:8080;
        }
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto http;
        proxy_read_timeout 30s;
        proxy_connect_timeout 3s;
    }
    location / { return 404; }
}
server {
    listen 80;
    server_name display.infra.lan;
    server_tokens off;
    access_log off;
    error_log /dev/null;
    client_max_body_size 4m;
    # Runtime provides CSP, no-store, no-referrer, HttpOnly/host-only cookies.
    # Do not overwrite those headers or log request URLs/cookies/headers/bodies.
    location /internal/ { return 404; }
    location / {
        proxy_pass http://127.0.0.1:5180;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto http;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 75s;
        proxy_connect_timeout 3s;
        proxy_send_timeout 30s;
    }
}
server {
    listen 80;
    server_name display-assets.infra.lan;
    server_tokens off;
    access_log off;
    error_log /dev/null;
    client_max_body_size 1k;
    # Never log the asset permit in its path. Do not serve the bucket directly.
    location /assets/ {
        proxy_pass http://127.0.0.1:5181;
        proxy_set_header Host $http_host;
        proxy_set_header Cookie '';
        proxy_set_header Authorization '';
        proxy_cache off;
        proxy_read_timeout 20s;
        proxy_connect_timeout 3s;
    }
    location / { return 404; }
}
