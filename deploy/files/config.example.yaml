# Supply database_url and object credentials through protected environment files.
# API uses its existing personnel identity configuration; worker reads only this section and DB.
files:
  accept_uploads: true
  object_endpoint: https://s3.internal.example
  bucket: infrapro-files-private
  node_id: files-node-1
  temp_directory: /run/infrapro-files
  checker_socket: /run/infrapro-files/checker.sock
  # Whole-file admission quota, configurable above/below the default; parts stay bounded.
  max_file_bytes: 104857600
  part_bytes: 8388608
  max_active_per_account: 3
  max_active_per_tenant: 20
  max_queued_per_tenant: 64
  max_queued_per_instance: 256
  temporary_object_budget: 21474836480
  local_temp_budget: 2147483648
  workers: 2
  max_running_per_tenant: 2
  lease: 60s
  heartbeat: 10s
  max_attempts: 5
  worker_heartbeat: 10s
  stale_after: 30s
  execution_timeout: 120s
  queue_timeout: 24h
  object_io_timeout: 120s
  part_request_timeout: 120s
  upload_idle_ttl: 24h
  upload_hard_ttl: 168h
  prepared_ttl: 24h
  retry_input_ttl: 24h
  trash_ttl: 720h
  preview_max_pixels: 25000000
  preview_edge: 1600
  preview_bytes: 2097152
  checker_timeout: 15s
  checker_memory: 268435456
  max_downloads_per_node: 8
  max_downloads_per_account: 2
  read_lease: 60s
  read_heartbeat: 10s
  chunk_bytes: 65536
  read_timeout: 15m
  create_requests_per_minute: 30
  part_requests_per_minute: 120
  read_requests_per_minute: 240
  cleanup_interval: 5m
  cleanup_batch: 100
  list_page_size: 50
  max_page_size: 100
